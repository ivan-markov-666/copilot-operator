# Step 6 of docs/testing.md: the download path.
#
#   npx tsx src/cli.ts run run.download.yaml
#
# Expect: "downloaded hello.ps1 (sha256 ...)" on the console, the file in
# runs/<runId>/artifacts/, and a step that runs it.
#
# The wording of the task matters more than it should. Asked to "attach" a file, Copilot
# replied that it had no way to attach files and gave up. Asked to "create" one and "give it
# to me as a downloadable file", the same surface ran its code interpreter and produced a
# real blob download. So the task below uses the phrasing that is known to work, and says
# outright that the code interpreter is the way to do it.

copilot:
  label: download
  stopMarker: Край

# Level 1 (the contract with the runner) is prompts/level1.md and is sent automatically.
# Level 2 is your project and team instructions; leave it out if there are none.
level2: ""
task: |
  Task: create a PowerShell script named hello.ps1 that prints the current date and the
  computer name, and nothing else.

  Give it to me as a downloadable file in this reply. Use your code interpreter to write
  the file if that is what it takes; a link I can click to download hello.ps1 is what the
  runner needs. Do not say you are unable to before you have tried it.

  In the same reply, send a single download step with "file": "hello.ps1" and
  "run": true, so the runner saves the file and executes it. When you have its output,
  report what it printed and finish.

execution:
  mode: confirm
  defaultShell: pwsh
  cwd: .
  commandTimeoutSec: 120
  idleTimeoutSec: 60
  allowedScriptExtensions: ['.ps1', '.cmd', '.bat']

limits:
  maxIterations: 5
  maxRunMinutes: 20
  maxFormatRetries: 2

runsDir: ./runs
