# Step 6 of docs/testing.md: the download path.
#
# This is the part that looked hardest at the start. Copilot generates a file, attaches it
# to the chat as a blob download, and the bot clicks it, saves it, hashes it and runs it.
#
#   npx tsx src/cli.ts run run.download.yaml
#
# Expect: "downloaded hello.ps1 (sha256 ...)" on the console, the file in
# runs/<runId>/artifacts/, and a step that runs it.
#
# If Copilot answers with the script as text instead of attaching a file, this tenant's
# code interpreter is not producing downloads and the contract needs inlined scripts instead.

copilot:
  label: download
  stopMarker: Край

openingMessages:
  - file: prompts/01-persona.md
  - file: prompts/02-format.md
  - text: |
      Task: write a PowerShell script named hello.ps1 that prints the current date and the
      computer name, and nothing else. Attach it to this chat as a downloadable file, and
      send a single download step with "file": "hello.ps1" and "run": true so the runner
      saves it and executes it. When you have its output, finish.

execution:
  mode: confirm
  defaultShell: pwsh
  cwd: .
  commandTimeoutSec: 120
  idleTimeoutSec: 60
  # hello.ps1 is a PowerShell script, which is already in the default allow list.
  allowedScriptExtensions: ['.ps1', '.cmd', '.bat']

limits:
  maxIterations: 5
  maxRunMinutes: 20
  maxFormatRetries: 2

runsDir: ./runs
