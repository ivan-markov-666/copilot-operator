# Smoke test. The smallest run that exercises the whole loop.
#
# The task is read-only on purpose: it asks Copilot to report facts about the machine and
# nothing else. Run this first, in confirm mode, before trusting the bot with real work.
#
#   npx tsx src/cli.ts run run.smoke.yaml
#
# Edit `cwd` to a scratch folder you do not mind commands running in.

copilot:
  label: smoke
  stopMarker: Край

# Level 1 (the contract with the runner) is prompts/level1.md and is sent automatically.
# Level 2 is your project and team instructions; leave it out if there are none.
level2: ""
task: |
  Task: report the Windows edition and build, and the free space on drive C, of the
  machine the runner is on. Use read-only commands only. Two steps at most. When you
  have both answers, put them in the summary and finish.

execution:
  mode: confirm
  defaultShell: pwsh
  # A scratch folder. Change this.
  cwd: .
  commandTimeoutSec: 120
  idleTimeoutSec: 60

limits:
  # Deliberately small: a smoke test that loops twenty times is a bug, not a feature.
  maxIterations: 4
  maxRunMinutes: 20
  maxFormatRetries: 2

runsDir: ./runs
